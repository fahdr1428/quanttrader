[project]
name = "quant-lab-pro"
version = "1.0.0"
description = "A locally runnable quantitative research and backtesting workstation for systematic equity strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.65,<2",
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "plotly>=7.0,<8",
    "yfinance>=1.7,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "error::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors and bugbear. Explicit so results do not change
# when a newer ruff release alters its default rule set.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # imports must follow st.set_page_config
"scripts/*" = ["E402"]  # sys.path is extended before project imports
